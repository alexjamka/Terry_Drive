; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; The ESP32 and the YDLidar are both CP2102 bridges reporting serial "0001",
; so /dev/serial/by-id collides and ttyUSB* ordering is not stable. Pin the
; upload to the physical USB socket so a flash can never hit the lidar.
; Re-derive after moving cables with:  ls -l /dev/serial/by-path/
upload_port = /dev/serial/by-path/platform-3610000.usb-usb-0:2.4:1.0-port0
monitor_port = /dev/serial/by-path/platform-3610000.usb-usb-0:2.4:1.0-port0

; Download the micro-ROS library directly from GitHub
lib_deps = 
    https://github.com/micro-ROS/micro_ros_arduino.git

; Tell the compiler where to find the pre-built ROS 2 C++ files
build_flags = 
    -L ./.pio/libdeps/esp32dev/micro_ros_arduino/src/esp32/
    -l microros