; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; The ESP32 and the YDLidar are both CP2102 bridges reporting serial "0001",
; so /dev/serial/by-id collides and ttyUSB* ordering is not stable. by-path is
; stable only until a cable moves, and these have moved repeatedly - so set the
; port explicitly at flash time rather than trusting a stale literal here:
;
;   ls -l /dev/serial/by-path/
;   pio run -t upload --upload-port /dev/serial/by-path/<the-esp32-one>
;
; Leaving it unset makes PlatformIO pick the first serial port it finds, which
; may well be the lidar - esptool will simply fail to sync, it cannot damage it.
; upload_port = <set via --upload-port>

; Download the micro-ROS library directly from GitHub
lib_deps = 
    https://github.com/micro-ROS/micro_ros_arduino.git

; Tell the compiler where to find the pre-built ROS 2 C++ files
build_flags = 
    -L ./.pio/libdeps/esp32dev/micro_ros_arduino/src/esp32/
    -l microros